version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./pipeforge.db
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - CORS_ORIGINS=http://localhost:80,http://localhost:3000
    volumes:
      - pipeline_data:/app/uploads
      - pipeline_outputs:/app/outputs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pipeline_data:
  pipeline_outputs:
